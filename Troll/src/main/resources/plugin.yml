name: Troll
version: 1.0.0
main: dev.troll.TrollPlugin
api-version: '1.21'
description: Owner-only troll menu with a jumpscare, fake keyboard disconnect, resource pack reload, reach and ascend trolls.
softdepend: [LuckPerms]
commands:
  troll:
    description: Open the troll menu or troll a player.
    usage: /<command> [player] [jumpscare|disconnect|resource|reach|ascend|reset]
    aliases: [trolls]
    permission: troll.use
    permission-message: Unknown command. Type "/help" for help.
permissions:
  troll.use:
    description: Use the troll menu and commands (grant this with LuckPerms, owner only)
    default: false
  troll.immune:
    description: Cannot be trolled
    default: false
